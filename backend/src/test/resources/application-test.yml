# ---------------------------------------------------------------------------
# Profile used by the automated tests.
#
# The suite runs against an in-memory H2 database so `mvn test` works on any
# machine without Docker or a PostgreSQL instance.
# ---------------------------------------------------------------------------

spring:
  datasource:
    url: jdbc:h2:mem:taskdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.taskmanager: INFO
