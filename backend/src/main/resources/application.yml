# ---------------------------------------------------------------------------
# Task Manager - backend configuration
#
# Every value can be overridden with an environment variable, which is how the
# credentials of PostgreSQL are injected. See ../.env.example for the full list.
# ---------------------------------------------------------------------------

spring:
  application:
    name: task-manager-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
    username: ${DB_USERNAME:taskuser}
    password: ${DB_PASSWORD:taskpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    # `update` creates/updates the table on start-up. For production use `validate`
    # together with a migration tool such as Flyway or Liquibase.
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    mapper:
      # The enum values are accepted in any case, so `priority: "high"` works
      # exactly like `priority: "HIGH"`. The query parameters already behaved
      # this way, and having both paths accept the same values avoids a
      # confusing difference between filtering and creating a task.
      accept-case-insensitive-enums: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

# Custom application settings
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.taskmanager: INFO
    org.hibernate.SQL: WARN
